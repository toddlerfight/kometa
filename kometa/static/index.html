<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- home-screen web app: no browser chrome at all, which on iPad is the only full screen there is -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="コメタ">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>コメタ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Victor Mono from Kometa itself (fonts/, faces in style.css): Google's stylesheet held the
       first paint until it answered — 4.5 s on a reload, 35 s cold (2026-10-17) -->
  <link rel="preload" href="/fonts/victor-mono-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css?v=331">
</head>
<body>
  <div id="nav-bar" aria-hidden="true"><div id="nav-bar-fill"></div></div>
  <div id="layout">
    <nav id="sidebar">
      <div class="logo">
        <div class="logo-mark"></div>
        <span class="logo-text">コメタ</span>
      </div>
      <div class="nav-items">
        <a class="nav-item u-label" data-view="ondeck">On Deck</a>
        <a class="nav-item u-label" data-view="readlists">Reading lists</a>
        <a class="nav-item u-label" data-view="library">Library</a>
        <a class="nav-item u-label" data-view="needs-match">Needs matching<span class="nav-badge" id="needs-badge"></span></a>
        <a class="nav-item u-label" data-view="pull-list">Pull List</a>
        <a class="nav-item u-label" data-view="activity">Activity<span class="nav-badge" id="activity-badge"></span></a>
        <a class="nav-item u-label" data-view="settings">Settings<span class="nav-badge" id="settings-badge"></span></a>
      </div>
      <a class="nav-item u-label nav-signout" id="nav-signout" onclick="signOut()" hidden>Sign out</a>
    </nav>
    <div id="content">
      <div id="series-bg" class="hidden">
        <div id="series-bg-img"></div>
      </div>
      <header id="topbar">
        <div id="topbar-row">
          <div id="topbar-title-group">
            <span id="topbar-title" class="page-heading"></span>
            <div id="topbar-chips" class="chips-row"></div>
          </div>
          <div id="topbar-actions"></div>
        </div>
        <div id="topbar-sub"></div>
      </header>
      <main id="app"></main>
    </div>
  </div>

  <div id="modal-backdrop" class="hidden" onclick="closeModal()">
    <div id="modal" class="hidden" onclick="event.stopPropagation()"></div>
  </div>

  <div id="variant-lightbox" class="hidden" onclick="_lbClose()">
    <button class="vlb-close" onclick="_lbClose(event)" aria-label="Close"><svg class="ico ico-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <button class="vlb-nav vlb-prev" onclick="_lbStep(event,-1)">‹</button>
    <button class="vlb-nav vlb-next" onclick="_lbStep(event,1)">›</button>
    <div class="vlb-stage" onclick="event.stopPropagation()">
      <img class="vlb-img" id="vlb-img" alt="">
      <div><div class="vlb-name" id="vlb-name"></div><div class="vlb-count" id="vlb-count"></div></div>
      <div class="vlb-actions">
        <button class="vlb-btn" id="vlb-include" onclick="_lbToggleInclude()">Include</button>
        <button class="vlb-btn vlb-star" id="vlb-star" onclick="_lbSetCover()"><svg class="ico ico-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.85 5.95 6.55.85-4.8 4.55 1.2 6.5L12 17.5l-5.8 3.15 1.2-6.5-4.8-4.55 6.55-.85z"/></svg> Set as cover</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast-hidden"></div>
  <div id="ptr">↓</div>

  <script src="/reader.js?v=78"></script>
  <script src="/app.js?v=404"></script>
</body>
</html>
